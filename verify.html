<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — ExamSimplify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Roboto+Slab:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto Slab', serif;
      background: linear-gradient(135deg, #4e1f66, #6B2D8B);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.3);
    }
    .logo { font-family: 'Alata', sans-serif; font-size: 1.4rem; color: #6B2D8B; margin-bottom: 8px; }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h1 { font-family: 'Alata', sans-serif; font-size: 1.6rem; color: #1a1a2e; margin-bottom: 12px; }
    p { color: #4a4a6a; font-size: 0.95rem; line-height: 1.7; margin-bottom: 24px; }
    .error { color: #e53e3e; }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(107,45,139,0.2);
      border-top-color: #6B2D8B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ExamSimplify</div>
    <div id="loading">
      <div class="spinner"></div>
      <h1>Verifying your email...</h1>
      <p>Please wait a moment.</p>
    </div>
<div id="error" style="display:none">
      <div class="icon" style="color:#e53e3e">✖</div>
      <h1>Verification Failed</h1>
      <p class="error" id="error-msg">Verification failed. The link may have expired. Please register again.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error-msg').textContent = 'Invalid verification link.';
    } else {
      window.location.replace('https://backend-production-8424.up.railway.app/verifyUser/' + token);
    }
  </script>
</body>
</html>
